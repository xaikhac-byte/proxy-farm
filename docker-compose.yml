# Proxy Farm. Start with ./run.sh: it creates the data folders, writes .env and runs
# `docker compose up`. After that, plain `docker compose up -d` / `down` works too.
#
# Only the manager is a compose service. Each proxy port is its own container, created
# and removed by the manager at runtime from the proxy-farm-node image built here. Those
# containers carry this project's label, so Docker Desktop shows them grouped under
# "proxy-farm", but `docker compose down` leaves them alone: stop ports from the UI.
name: proxy-farm

services:
  # Build-only: the image every proxy port runs. Never started by compose.
  node:
    build: ./node
    image: proxy-farm-node
    profiles: [build]

  manager:
    build: ./manager
    image: proxy-farm-manager
    container_name: pf-manager
    restart: unless-stopped
    # Published port rather than host networking: it works the same on Linux, macOS and
    # Windows. Bound to 127.0.0.1 so the UI never reaches the network.
    ports:
      - "127.0.0.1:${PORT:-8090}:${PORT:-8090}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FARM:?FARM is not set - run ./run.sh once, it writes .env}/data:/data
      - ${FARM}/status:/status
      - ${FARM}/configs:/configs
      - ${FARM}/secrets:/secrets
      - ${FARM}/inbox:/inbox
      - ${SCAN}:/scan:ro
    environment:
      PF_UI_PORT: ${PORT:-8090}
      PF_UI_BIND: 0.0.0.0
      PF_BIND: ${BIND:-127.0.0.1}
      PF_STATE: /data/farm-state.json
      PF_COMPOSE_PROJECT: proxy-farm
      # The manager starts port containers through the host's Docker, so it needs the
      # host-side path of every folder it mounts into them.
      PF_STATUS_DIR: /status
      # FARM_HOST: the same folder as the Docker daemon names it. Only differs on Windows
      # (run.ps1 sets /run/desktop/mnt/host/c/... for C:\...), elsewhere it is FARM.
      PF_STATUS_HOST: ${FARM_HOST:-${FARM}}/status
      PF_CONFIG_DIR: /configs
      PF_CONFIG_HOST: ${FARM_HOST:-${FARM}}/configs
      PF_SECRETS_DIR: /secrets
      PF_SECRETS: ${FARM_HOST:-${FARM}}/secrets
      PF_INBOX: /inbox
      PF_INBOX_HOST: ${FARM}/inbox
      PF_SCAN: /scan
      PF_SCAN_HOST: ${SCAN}
      # Weak PC: LOW_RESOURCE=1 caps every port's RAM/CPU and allows MAX_ACTIVE ports
      # on at once (default 3). Both can be changed later in the UI (Settings).
      PF_LOW_RESOURCE: ${LOW_RESOURCE:-0}
      PF_MAX_ACTIVE: ${MAX_ACTIVE:-}
    # The manager is a small Python process (~20-30 MiB measured); the cap only stops a
    # runaway from eating a low-RAM machine.
    mem_limit: ${MANAGER_MEM:-256m}
